[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "inferedge"
version = "0.1.0"
description = "Production ML inference server: ONNX + Triton + FastAPI, <8ms P99"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "Sherif Abd El-Rady", email = "sherifabdelrady@gmail.com" },
]
keywords = ["mlops", "inference", "onnx", "triton", "fastapi"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.100",
  "uvicorn[standard]",
  "onnxruntime-gpu",
  "numpy",
  "pillow",
  "pydantic>=2.0",
  "tritonclient[all]",
]

[project.urls]
Homepage = "https://sherifabdelrady.github.io/cv-portfolio/"
Repository = "https://github.com/sherifabdelrady/inferedge"
Issues = "https://github.com/sherifabdelrady/inferedge/issues"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
